<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beltopolis">
<meta name="theme-color" content="#1b2433">
<title>Beltopolis (Skill Tree test)</title>
<link rel="manifest" href="manifest.webmanifest?v=st3">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=st3">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=st3">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=st3">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=st3">
<link rel="stylesheet" href="style.css?v=st3">
</head>
<body>
<canvas id="cv"></canvas>
<div id="frame" aria-hidden="true">
  <span class="fc tl"><i></i></span>
  <span class="fc tr"><i></i></span>
  <span class="fc bl"><i></i></span>
  <span class="fc br"><i></i></span>
</div>
<div id="top">
  <button type="button" id="xpBar" aria-label="Player level and XP">
    <span class="xp-badge" id="xpBadge">Lv 1</span><span class="xp-medal" id="xpMedal" hidden role="button" aria-label="Medals"><img alt=""></span>
    <span class="xp-track" aria-hidden="true"><i id="xpFill"></i></span>
    <span class="xp-lab" id="xpLab"></span>
  </button>
  <div id="quest" class="card"></div>
  <div id="stockWrap">
    <div id="stock"></div>
    <button type="button" id="aaToggle" class="aa-toggle on" aria-label="Toggle resource names" aria-pressed="true">Aa</button>
  </div>
</div>
<div id="hint"></div>
<div id="bottom">
  <button id="bBld" class="nav" type="button" aria-label="My Buildings"><span class="ic">🏭</span><span>Buildings</span></button>
  <button id="bPerk" class="nav main"><span class="ic">✦</span><span>Rebirth</span><span id="ppBadge" class="ppb"></span></button>
  <button id="bHub" class="nav" type="button" aria-label="Jump to your Hub"><span class="ic">🏠</span><span>Hub</span></button>
  <button id="bMap" class="nav" aria-label="View whole map"><span class="ic">🗺</span><span>Map</span></button>
  <button id="bMenu" class="nav"><span class="ic">☰</span><span>Menu</span></button>
</div>
<div id="photoBar">
  <button type="button" class="btn" data-a="x">Cancel</button>
  <span>Photo mode — frame your factory</span>
  <button type="button" class="btn green" data-a="shot">Take Photo</button>
</div>
<div id="photoPrev" role="dialog" aria-label="Factory photo"></div>
<div id="hutLoc">
  <button type="button" id="locWoodHut" class="hutloc" hidden aria-label="Find Woodcutter's Hut"><canvas aria-hidden="true"></canvas><span class="hutloc-mark" aria-hidden="true">🌲</span><span class="hutloc-badge" hidden>0</span></button>
  <button type="button" id="locRockHut" class="hutloc" hidden aria-label="Find Quarry Hut"><canvas aria-hidden="true"></canvas><span class="hutloc-mark" aria-hidden="true">⛏️</span><span class="hutloc-badge" hidden>0</span></button>
</div>
<aside id="dock" aria-label="Game panel">
  <div class="dk-brand"><img id="dkLogo" alt=""><b>Beltopolis</b><span id="dkWorld" class="dk-world"></span></div>
  <div id="dkStatus"></div>
  <nav class="dk-tabs" aria-label="Panels">
    <button type="button" class="dk-tab" data-t="build"><span class="ic">🔨</span><span>Build</span></button>
    <button type="button" class="dk-tab main" data-t="perk"><span class="ic">✦</span><span>Rebirth</span><i id="dkPP" class="ppb"></i></button>
    <button type="button" class="dk-tab" data-t="skill"><span class="ic">🌳</span><span>Skills</span></button>
    <button type="button" class="dk-tab" data-t="style"><span class="ic">🎨</span><span>Style</span></button>
    <button type="button" class="dk-tab" data-t="book"><span class="ic">📖</span><span>Recipes</span></button>
    <button type="button" class="dk-tab" data-t="menu"><span class="ic">☰</span><span>Menu</span></button>
  </nav>
  <div id="dkBody"><div id="dkIdle"></div></div>
</aside>
<div id="sheetWrap"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="banner"></div>
<script src="game.js?v=st3"></script>
</body>
</html>
